name: Deploy

# push 到 main 就自動：檢查單字 → 跑測試 → 建立/更新資料庫 → 部署到 Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 檢查單字資料 + 測試
        run: npm test

      - name: 找到或建立 D1 資料庫（voca-db）
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const db=JSON.parse(s).find(d=>d.name==="voca-db");
                process.stdout.write(db ? (db.uuid||db.id||"") : "");
              })'
          }
          DB_ID=$(find_id)
          if [ -z "$DB_ID" ]; then
            echo "建立新的 D1 資料庫 voca-db"
            npx wrangler d1 create voca-db
            DB_ID=$(find_id)
          fi
          if [ -z "$DB_ID" ]; then echo "::error::找不到 D1 資料庫，請確認 API Token 有 D1 Edit 權限"; exit 1; fi
          echo "D1 database id: $DB_ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$DB_ID/" wrangler.toml

      - name: 建立 / 更新資料表
        run: npx wrangler d1 execute voca-db --remote --file=schema.sql

      - name: 部署 Worker
        run: npx wrangler deploy

      - name: 設定 Worker 金鑰
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node -e '
            const e=process.env, s={};
            for (const k of ["LINE_CHANNEL_SECRET","LINE_CHANNEL_ACCESS_TOKEN","CRON_SECRET"]) {
              if (!e[k]) { console.error("::error::缺少 GitHub Secret: "+k); process.exit(1); }
              s[k]=e[k];
            }
            require("fs").writeFileSync("secrets.json", JSON.stringify(s));'
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
